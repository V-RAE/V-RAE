[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "v-rae"
version = "0.1.0"
description = "Official PyTorch implementation of V-RAE: Rethinking Video Latent Spaces for Generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.12.1",
  "torchvision==0.27.1",
  "huggingface-hub==1.22.0",
  "transformers>=4.48,<5",
  "Pillow==11.3.0",
  "numpy==2.2.6",
  "PyYAML==6.0.3",
  "tqdm==4.68.3",
  "wandb==0.28.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.14,<1",
]

[project.urls]
Homepage = "https://v-rae.github.io/"
Models = "https://huggingface.co/Guomh0707/V-RAE-Models"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["vrae", "vrae.*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["third_party", "ckpts", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
