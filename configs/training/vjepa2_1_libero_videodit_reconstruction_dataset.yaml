include:
  - libero_videodit.yaml

task: libero_videogen
run_name: vjepa2_1_libero_videodit_reconstruction_dataset
model:
  multiview:
    enabled: false
    num_views: 1
  decoder:
    attention_mode: full
stage1:
  checkpoint: ckpts/pretrained/vrae/vrae_vjepa2.1.pt
  weights: ema
  precision: bf16
latent_normalizer:
  path: ckpts/libero_videogen/latent_stats/vjepa2_1_libero_reconstruction_dataset.pt
dit:
  num_classes: 40
transport:
  time_dist_shift: 16.0
data:
  dataset: reconstruction
  manifest: data/metadata/libero_reconstruction.csv
  camera_keys:
    - {key: observation.images.image, name: head, stream_id: 0}
  num_frames: 16
  frame_interval: 4
  random_frame_interval: true
  frame_interval_min: 1
  frame_interval_max: 4
  image_size: 256
  random_flip: true
  seed: 3407
training:
  resume: null
  init_from: null
  global_batch_size: 8
  epochs: 3000
wandb:
  group: libero_videogen_reconstruction_dataset
  tags: [libero, reconstruction_dataset, vjepa2_1, single_view, random_interval]
  resume: never
