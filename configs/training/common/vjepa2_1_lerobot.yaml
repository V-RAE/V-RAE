include:
  - ../../models/vrae_vjepa2_1_l_k7.yaml
  - ../../data/libero.yaml
task: recon_training
run_name: vjepa2_1_libero_reconstruction
model:
  multiview:
    enabled: false
  decoder:
    init: scratch
    attention_mode: full
training:
  init_from: null
  resume: null
  epochs: 50
  checkpoint_interval: 1000
  global_batch_size: 32
  gradient_accumulation_steps: 1
  precision: bf16
  num_workers: 4
  optimizer:
    name: adamw
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    name: constant
    warmup_steps: 0
  latent_noise:
    enabled: true
    tau: 0.8
    apply_in_eval: false
  ema:
    decay: 0.9995
data:
  dataset: lerobot_reconstruction
  manifest: data/metadata/libero_reconstruction.csv
  num_frames: 16
  frame_interval: 3
  random_frame_interval: false
  frame_interval_min: 1
  frame_interval_max: 4
  sampling: random
  crop_mode: random
  random_flip: true
loss:
  l1: 1.0
  lpips: 1.0
  gram: 100.0
  temporal_difference: 0.0
  perceptual_frames_per_chunk: 4
  perceptual_chunk_size: 4
  backbone_checkpoint: ckpts/pretrained/perceptual/vgg16.pt
  calibration_checkpoint: ckpts/pretrained/perceptual/lpips_vgg.pt
gan:
  enabled: true
  type: videomae
  generator_start_epoch: 30
  discriminator_start_epoch: 30
  update_interval: 5
  generator_weight: 0.3
  discriminator_checkpoint: ckpts/pretrained/discriminators/videomae/vit_b_hybrid_pt_800e.pth
  key_depths: [2, 5, 8, 11]
  head_kernel_size: 9
  head_norm_type: bn
  spectral_norm: true
  norm_eps: 1.0e-6
  diff_aug_prob: 1.0
  diff_aug_cutout: 0.2
  gen_loss_type: ns_g_loss
  disc_loss_type: ns_smooth
  lecam: true
  lecam_weight: 0.001
  discriminator_weight: 0.3
  input_range: zero_one
  input_clamp: true
  optimizer:
    name: adamw
    lr: 2.0e-5
    betas: [0.9, 0.95]
    weight_decay: 1.0e-4
  scheduler:
    name: constant
    warmup_steps: 0
wandb:
  project: V-RAE
  group: libero_reconstruction
  tags: [libero, reconstruction, vjepa2_1, single_view]
  mode: online
  resume: allow
  log_interval: 20
  sample_interval: 1000
  sample_count: 4
