# Shared settings of the EUPE NanoVVM first-frame -> 16-frame configs. Not runnable on its
# own: eupe_mix5.yaml and eupe_bridgedatav2.yaml add run_name, latent_normalizer and data.train/val.
include:
  - ../../models/vrae_eupe_b_k7.yaml
  - ../../models/dit_first_frame_prediction.yaml
task: nanovvm_video_pred
stage1:
  checkpoint: ckpts/vrae/vrae_eupe.pt
  weights: ema
  precision: bf16
dit:
  input_dim: 768
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
  # sqrt(future_chunks * h * w * C / 4096) = sqrt(4 * 16 * 16 * 768 / 4096) = sqrt(192)
  time_dist_shift: 13.856406460551018
  t_eps: 0.05
  base_model_coeff: 1.0
training:
  resume: null
  init_from: null
  global_batch_size: 64
  gradient_accumulation_steps: 1
  epochs: 1
  checkpoint_interval: 5000
  precision: bf16
  num_workers: 8
  optimizer: {name: adamw, lr: 1.0e-4, betas: [0.9, 0.95], weight_decay: 0.05}
  scheduler: {name: constant, warmup_steps: 0}
  ema: {decay: 0.9995}
data:
  dataset: nanovvm
  # null: use datasets.nanovvm from the --paths file. An absolute path (or one relative to
  # the repository root) overrides it. Source paths below are relative to this root.
  data_root: null
  # NanoVVM cond1gen16_interval3: source frames s + 3k, k = 0..16; frame 0 conditions,
  # frames 1..16 (s+3 ... s+48) are the prediction target.
  rgb_seq_len: 17
  frame_interval: 3
  condition_frames: 1
  future_frames: 16
  image_size: 256
  preprocessing:
    horizontal_flip_prob: 0.0
    resize: {mode: short_side, interpolation: bilinear, antialias: false}
    crop: {mode: center}
  video_decoder: decord
  seed: 3407
  fps: 10
sampling: {base_seed: 3407, steps: 100, cfg_scale: 1.0, internal_guidance_scale: 1.0}
wandb:
  project: V-RAE
  group: nanovvm_video_prediction
  tags: [nanovvm, video_prediction, first_frame, eupe]
  mode: offline
  resume: allow
  log_interval: 20
  sample_interval: 1000
  sample_count: 2
