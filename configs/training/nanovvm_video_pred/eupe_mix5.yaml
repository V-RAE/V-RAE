# EUPE-B/16 V-RAE, first-frame conditioned 16-frame future prediction on NanoVVM mix5.
# Sources are the 18 cond1gen16_interval3 manifests of nanovvm@37c2377
# configs/scaling-ladder/tiny/mix5_tiny_vpred_interval3_l1_cond1gen16_bs64_lr2e-4_wd0_ep1.yaml:
#   data.train = training.video.sources   (split_val0.0001_min100/train)
#   data.val   = fvd.splits.val.sources   (split_val0.0001_min100/val, never trained on)
# NanoVVM's ${paths.data}/ prefix is dropped: every root/manifest/manifest_meta below is
# relative to the NanoVVM data root, i.e. datasets.nanovvm in the --paths file (or
# data.data_root in _eupe_common.yaml). ${paths.holdout} is written out as
# split_val0.0001_min100. Check the resolved files with:
#   python -m vrae.training.nanovvm_video_pred.check --config <this file> --paths <paths file>
include: _eupe_common.yaml
run_name: eupe_mix5_cond1gen16
latent_normalizer:
  path: ckpts/nanovvm_video_pred/latent_stats/eupe_mix5_cond1gen16_future_vrae_ema_bf16.pt
  fit_clips: 20000
  fit_seed: 0
  batch_size: 16
data:
  train:
    sources:
      - name: bridgedatav2
        dataset: bridgedatav2
        root: bridgedatav2_video/data/raw
        manifest: bridgedatav2_video/manifests/cond1gen16_interval3/split_val0.0001_min100/train/manifest.json
        manifest_meta: bridgedatav2_video/manifests/cond1gen16_interval3/split_val0.0001_min100/train/meta.yaml
