include:
  - ../models/vrae_vjepa2_1_l_k7.yaml
  - ../models/dit_class_cond.yaml
  - ../data/libero.yaml
task: libero_videogen
run_name: vjepa2_1_libero_videodit
model:
  decoder:
    attention_mode: full
stage1:
  checkpoint: ckpts/recon_training/vjepa2_1_libero_reconstruction/checkpoints/latest.pt
  weights: ema
  precision: bf16
latent_normalizer:
  path: ckpts/libero_videogen/latent_stats/vjepa2_1_libero_multiview.pt
dit:
  num_classes: 40
  attention_backend: auto
  gradient_checkpointing: true
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
  time_dist_shift: 22.627416997969522
  t_eps: 0.05
  base_model_coeff: 1.0
training:
  resume: null
  init_from: null
  global_batch_size: 32
  gradient_accumulation_steps: 1
  clip_grad: 1.0
  epochs: 3000
  checkpoint_interval: 1000
  precision: bf16
  optimizer:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    eps: 1.0e-8
  scheduler:
    name: linear
    warmup_epochs: 10
    decay_end_epoch: 3000
    base_lr: 1.0e-4
    final_lr: 5.0e-5
    warmup_from_zero: true
  ema:
    decay: 0.9995
runtime:
  data_pipeline:
    kind: lerobot_bounded
    worker_threads: 8
    max_inflight: 32
    max_buffered_batches: 4
    async_prefetch_batches: 2
    max_decode_attempts_per_batch: 2048
    pin_memory: true
    glibc_arena_max: 2
    glibc_trim_threshold_bytes: 134217728
    trim_heap_each_epoch: true
    collect_python_each_epoch: false
  checkpoint:
    mmap: true
    drop_page_cache: true
  host_memory:
    log: true
    min_available_gb: 0
sampling:
  base_seed: 3407
  steps: 100
  cfg_scale: 1.0
  internal_guidance_scale: 1.3
  internal_guidance_t_min: 0.10
  internal_guidance_t_max: 1.0
  class_ids: [0, 10, 20, 30]
wandb:
  project: V-RAE
  group: libero_videogen
  tags: [libero, class_conditional, vjepa2_1, multiview]
  mode: online
  resume: never
  log_interval: 20
  sample_interval: 1000
  sample_count: 4
