include:
  - ../vjepa2_1_libero_videodit_base.yaml

run_name: smoke_optimized
paths:
  checkpoint_write_root: ckpts/libero_videogen/smoke
training:
  global_batch_size: 32
  checkpoint_interval: 1000
runtime:
  data_pipeline:
    worker_threads: 8
    max_inflight: 32
    max_buffered_batches: 4
    async_prefetch_batches: 2
    pin_memory: true
wandb:
  mode: offline
  log_interval: 10
  sample_interval: 1000
